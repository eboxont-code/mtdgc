name: Refresh Bun lockfile for dependency change

on:
  pull_request:
    branches: [main]
    paths:
      - "package.json"
      - ".github/workflows/lockfile-refresh.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Generate the lockfile without installing packages
        run: bun install --lockfile-only
      - name: Commit generated lockfile to the PR branch
        env:
          GITHUB_HEAD_REF: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          if git diff --cached --quiet; then
            echo "bun.lock is already current"
            exit 0
          fi
          git commit -m "chore: update Bun lockfile for sharp"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
      - name: Upload generated lockfile evidence
        uses: actions/upload-artifact@v4
        with:
          name: mtdgc-bun-lockfile
          path: bun.lock
          if-no-files-found: error
          retention-days: 1
